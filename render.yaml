# Render Blueprint for KaryaSetu (free tier).
# Deploy by pushing this repo to GitHub, then on https://render.com:
#   New  ->  Blueprint  ->  pick this repo. Render reads this file and creates
#   both the web service and a free Postgres database, wiring DATABASE_URL for you.
# (This session created the same resources directly via the Render connector;
#  this file is kept so the setup is reproducible / re-deployable by anyone.)

services:
  - type: web
    name: karyasetu
    runtime: python
    plan: free
    region: singapore          # closest Render region to India (ap-south has none)
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: HTTPS
        value: "1"
      - key: SECRET_KEY
        generateValue: true    # Render generates a strong random value once
      - key: DATABASE_URL
        fromDatabase:
          name: karyasetu-db
          property: connectionString

databases:
  - name: karyasetu-db
    plan: free
    region: singapore
